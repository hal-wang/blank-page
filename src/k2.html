<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>签名计算工具</title>
    <link rel="icon" href="./favicon.ico">
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
      }
      body {
        max-width: 700px;
        margin: 30px auto;
        padding: 0 4px;
        background: #f5f7fa;
      }
      .container {
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }
      h2 {
        text-align: center;
        margin-bottom: 15px;
        color: #333;
        font-size: 20px;
      }
      .form-item {
        margin: 10px 0;
      }
      label {
        display: block;
        margin-bottom: 4px;
        font-weight: bold;
        color: #555;
        font-size: 14px;
      }
      input {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #ddd;
        border-radius: 5px;
        font-size: 14px;
      }
      /* 紧凑自适应样式 */
      .info-box {
        padding: 8px 10px;
        background: #f8f9fa;
        border-radius: 5px;
        margin: 8px 0;
        word-wrap: break-word;
        line-height: 1.3;
        font-size: 14px;
      }
      .result-box {
        padding: 10px;
        background: #e3f2fd;
        border-radius: 5px;
        word-break: break-all;
        margin: 12px 0;
        line-height: 1.3;
        font-size: 14px;
      }
      .btn {
        padding: 8px 16px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 14px;
        margin-right: 8px;
      }
      .btn:hover {
        background: #0056b3;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>签名计算工具</h2>

      <div class="info-box">
        <label>密钥（来自 URL 参数 sk）：</label>
        <div id="secretKey"></div>
      </div>

      <div class="form-item">
        <label>开始日期：</label>
        <input type="date" id="startDate" />
      </div>

      <div class="form-item">
        <label>结束日期：</label>
        <input type="date" id="endDate" />
      </div>

      <div class="form-item">
        <label>设备码：</label>
        <input type="text" id="deviceId" placeholder="请输入设备码" />
      </div>

      <button class="btn" onclick="calculate()">计算签名</button>
      <button class="btn" onclick="copyResult()">复制结果</button>

      <div class="result-box">
        <strong>最终签名结果：</strong><br />
        <span id="result"></span>
      </div>
    </div>

    <script>
      window.onload = function () {
        const params = new URLSearchParams(window.location.search);
        const secretKey = params.get("sk") || "";
        document.getElementById("secretKey").innerText = secretKey;

        const startTime = new Date();
        const endTime = new Date();
        endTime.setFullYear(startTime.getFullYear() + 1);

        document.getElementById("startDate").value = formatLocalDate(startTime);
        document.getElementById("endDate").value = formatLocalDate(endTime);
      };

      function formatLocalDate(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      function dateToDays(dateStr) {
        const d = new Date(dateStr);
        const base = new Date("1995-04-20");
        return Math.floor((d - base) / 86400000);
      }

      function writeUint24(buffer, offset, value) {
        buffer[offset] = value & 0xff;
        buffer[offset + 1] = (value >> 8) & 0xff;
        buffer[offset + 2] = (value >> 16) & 0xff;
      }

      async function hmacSha256Hex(message, key) {
        const enc = new TextEncoder();
        const cryptoKey = await crypto.subtle.importKey(
          "raw",
          enc.encode(key),
          { name: "HMAC", hash: "SHA-256" },
          false,
          ["sign"],
        );
        const sig = await crypto.subtle.sign(
          "HMAC",
          cryptoKey,
          enc.encode(message),
        );
        return Array.from(new Uint8Array(sig))
          .map((b) => b.toString(16).padStart(2, "0"))
          .join("");
      }

      async function packBinary(startDays, days, secretKey, deviceHash) {
        const payload = startDays + "|" + days + "|" + deviceHash;

        const hmacHex = await hmacSha256Hex(payload, secretKey);
        const hmacBytes = [];
        for (let i = 0; i < 32; i += 2) {
          hmacBytes.push(parseInt(hmacHex.substr(i, 2), 16));
        }
        const truncated = hmacBytes.slice(0, 16);

        const buffer = new Uint8Array(22);
        buffer.set(truncated, 0);
        writeUint24(buffer, 16, startDays);
        writeUint24(buffer, 19, days);

        return buffer;
      }

      async function calculate() {
        const secretKey = document.getElementById("secretKey").innerText.trim();
        const startDate = document.getElementById("startDate").value.trim();
        const endDate = document.getElementById("endDate").value.trim();
        const deviceId = document.getElementById("deviceId").value.trim();

        if (!secretKey || !startDate || !endDate || !deviceId) {
          alert("请填写完整信息");
          return false;
        }

        const startDays = dateToDays(startDate);
        const days = dateToDays(endDate) - startDays;

        const binary = await packBinary(startDays, days, secretKey, deviceId);
        const result = uint8ArrayToBase58(binary);

        document.getElementById("result").innerText = result;
        return true;
      }

      var BASE58_ALPHABET =
        "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";

      function uint8ArrayToBase58(bytes) {
        var n = 0n;
        for (var i = 0; i < bytes.length; i++) n = n * 256n + BigInt(bytes[i]);
        var s = "";
        while (n > 0n) {
          s = BASE58_ALPHABET[Number(n % 58n)] + s;
          n /= 58n;
        }
        for (var i = 0; i < bytes.length && bytes[i] === 0; i++) s = "1" + s;
        return s;
      }

      async function copyResult() {
        const success = await calculate();
        if (!success) return;

        let res = document.getElementById("result").innerText;
        navigator.clipboard
          .writeText(res)
          .then(() => {
            alert("复制成功！");
          })
          .catch(() => {
            alert("复制失败，请手动复制");
          });
      }
    </script>
  </body>
</html>
